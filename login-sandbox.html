<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiat Company - Acceso</title>
    
    <!-- Importamos la librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================
           CSS - DISEÑO GENIAL (GLASSMORPHISM)
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050b14;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .background-animation {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 180, 216, 0.08) 0%, transparent 60%);
            z-index: -1;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 1;
        }

        .login-box {
            background: rgba(10, 25, 47, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 180, 216, 0.2);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 180, 216, 0.1);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-svg {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(0, 180, 216, 0.6));
        }

        .logo-area h1 {
            color: #00b4d8;
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 180, 216, 0.3);
        }

        .subtitle {
            font-size: 12px;
            color: #8892b0;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: #00b4d8;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(5, 11, 20, 0.8);
            border: 1px solid #1e3a5f;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00b4d8;
            box-shadow: 0 0 10px rgba(0, 180, 216, 0.2);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 12px;
        }

        .remember-me {
            color: #8892b0;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .forgot-password {
            color: #00b4d8;
            text-decoration: none;
            transition: color 0.3s;
            cursor: pointer;
        }

        .forgot-password:hover {
            color: #fff;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #00b4d8;
            color: #050b14;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover:not(:disabled) {
            background: #0077b6;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.5);
        }

        .btn-primary:disabled {
            background: #1e3a5f;
            color: #8892b0;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Estilo para el botón de Google */
        .btn-google {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-google:hover {
            background: #f1f1f1;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #8892b0;
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(0, 180, 216, 0.2);
        }

        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        .toggle-text {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #8892b0;
        }

        .toggle-text a {
            color: #00b4d8;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }

        .message-box {
            padding: 10px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .message-box.error {
            display: block;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
        }

        .message-box.success {
            display: block;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #4dff4d;
            color: #4dff4d;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>

    <div class="login-container">
        <div class="login-box">
            <div class="logo-area">
                <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#00b4d8" stroke-width="4"/>
                    <text x="50" y="65" font-family="Arial" font-size="40" font-weight="bold" fill="#00b4d8" text-anchor="middle">W</text>
                </svg>
                <h1>WHIAT COMPANY</h1>
                <p class="subtitle">Acceso Restringido al Sistema</p>
            </div>

            <!-- FORMULARIO DE INICIAR SESIÓN -->
            <div id="loginSection">
                <form id="loginForm">
                    <div class="input-group">
                        <label for="loginEmail">Correo Electrónico</label>
                        <input type="email" id="loginEmail" placeholder="tu@email.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="loginPassword">Contraseña</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>

                    <div class="options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember"> Recordarme
                        </label>
                        <a href="#" class="forgot-password" onclick="alert('Función en desarrollo')">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" id="loginBtn" class="btn-primary">
                        <span class="btn-text">Iniciar Sesión</span>
                    </button>
                </form>

                <!-- Divisor Visual -->
                <div class="divider">O</div>

                <!-- Botón de Google -->
                <button type="button" id="googleLoginBtn" class="btn-google">
                    <svg style="width:20px; height:20px;" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                    </svg>
                    Continuar con Google
                </button>

                <div class="toggle-text">
                    ¿No tienes una cuenta? <a id="goToRegister">Regístrate aquí</a>
                </div>
            </div>

            <!-- FORMULARIO DE REGISTRO -->
            <div id="registerSection" class="hidden">
                <form id="registerForm">
                    <div class="input-group">
                        <label for="registerEmail">Correo Electrónico</label>
                        <input type="email" id="registerEmail" placeholder="tu@email.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="registerPassword">Contraseña</label>
                        <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>

                    <button type="submit" id="registerBtn" class="btn-primary">
                        <span class="btn-text">Crear Cuenta</span>
                    </button>
                </form>

                <div class="toggle-text">
                    ¿Ya tienes una cuenta? <a id="goToLogin">Inicia Sesión aquí</a>
                </div>
            </div>

            <!-- Mensaje de error/éxito -->
            <div id="messageBox" class="message-box"></div>
        </div>
    </div>

    <script>
        /* =========================================
           JAVASCRIPT - LÓGICA DE LOGIN Y REGISTRO
           ========================================= */

        const SUPABASE_URL = 'https://orzbnvgjadwxxmqqeqru.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_xvFhBazFvnijDOpY95XnCw_zX83Qs3Q';
        
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log("Supabase inicializado correctamente.");
        } catch (e) {
            console.error("Error al inicializar Supabase:", e);
        }

        const loginSection = document.getElementById('loginSection');
        const registerSection = document.getElementById('registerSection');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const messageBox = document.getElementById('messageBox');
        
        const goToRegister = document.getElementById('goToRegister');
        const goToLogin = document.getElementById('goToLogin');

        // Cambiar entre Login y Registro
        goToRegister.addEventListener('click', (e) => {
            e.preventDefault();
            loginSection.classList.add('hidden');
            registerSection.classList.remove('hidden');
            messageBox.className = 'message-box';
            messageBox.textContent = '';
        });

        goToLogin.addEventListener('click', (e) => {
            e.preventDefault();
            registerSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            messageBox.className = 'message-box';
            messageBox.textContent = '';
        });

        // LOGIN CON EMAIL/PASSWORD
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            const btnText = loginBtn.querySelector('.btn-text');

            loginBtn.disabled = true;
            btnText.textContent = 'Autenticando...';
            messageBox.className = 'message-box';
            messageBox.textContent = '';

            if (!supabaseClient) {
                showMessage('Error: Supabase no inicializado.', 'error');
                loginBtn.disabled = false;
                btnText.textContent = 'Iniciar Sesión';
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                showMessage('¡Inicio de sesión exitoso! Redirigiendo...', 'success');
                console.log('Usuario logueado:', data.user);
                
                window.location.href = 'dashboard.html';

            } catch (error) {
                console.error('Error de login:', error.message);
                let mensajeError = error.message;
                if (error.message === 'Invalid login credentials') {
                    mensajeError = 'Correo o contraseña incorrectos.';
                } else if (error.message.includes('Email not confirmed')) {
                    mensajeError = 'Debes confirmar tu correo electrónico antes de entrar.';
                }
                showMessage(mensajeError, 'error');
                loginBtn.disabled = false;
                btnText.textContent = 'Iniciar Sesión';
            }
        });

        // LOGIN CON GOOGLE
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/dashboard.html'
                }
            });

            if (error) {
                console.error('Error al iniciar sesión con Google:', error.message);
                showMessage('Error al conectar con Google. Intenta de nuevo.', 'error');
            }
        });

        // REGISTRO
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const registerBtn = document.getElementById('registerBtn');
            const btnText = registerBtn.querySelector('.btn-text');

            registerBtn.disabled = true;
            btnText.textContent = 'Creando cuenta...';
            messageBox.className = 'message-box';
            messageBox.textContent = '';

            if (!supabaseClient) {
                showMessage('Error: Supabase no inicializado.', 'error');
                registerBtn.disabled = false;
                btnText.textContent = 'Crear Cuenta';
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                if (data.user && !data.session) {
                    showMessage('¡Cuenta creada! Revisa tu correo para confirmar.', 'success');
                } else {
                    showMessage('¡Cuenta creada y sesión iniciada con éxito!', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }
                
                console.log('Usuario registrado:', data.user);

                setTimeout(() => {
                    registerForm.reset();
                    registerBtn.disabled = false;
                    btnText.textContent = 'Crear Cuenta';
                    goToLogin.click();
                }, 3000);

            } catch (error) {
                console.error('Error de registro:', error.message);
                let mensajeError = error.message;
                if (error.message.includes('User already registered')) {
                    mensajeError = 'Este correo ya está registrado. Inicia sesión.';
                } else if (error.message.includes('Password should be at least')) {
                    mensajeError = 'La contraseña es demasiado corta (mínimo 6 caracteres).';
                }
                showMessage(mensajeError, 'error');
                registerBtn.disabled = false;
                btnText.textContent = 'Crear Cuenta';
            }
        });

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = `message-box ${type}`;
        }
    </script>
</body>
</html>
